services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mpu_events
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    environment:
      ENV_FOR_DYNACONF: docker
      PYTHONPATH: /app/src
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    configs:
      - source: app_config
        target: /app/config/config.toml
      - source: app_secrets
        target: /app/config/.secrets_config.toml

volumes:
  postgres_data:

configs:
  app_config:
    file: ./config/config.toml
  app_secrets:
    file: ./config/.secrets_config.toml